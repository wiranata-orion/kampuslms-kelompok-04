name: CI

on:
  push:
    branches: [main, perbaikan-uts]
  pull_request:
    branches: [main, perbaikan-uts]

jobs:
  laravel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pastikan .env tidak ter-commit
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env ter-commit ke repository!"; exit 1
          fi

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, bcmath
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install dependensi JS dan build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: migrate:fresh --seed
        run: php artisan migrate:fresh --seed --force

      - name: migrate:refresh (uji migrasi reversible)
        run: php artisan migrate:refresh --force

      - name: Jalankan test
        run: php artisan test